name: Deploy Shopify Extensions

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - "extensions/**"
      - "shopify.extension.toml"
      - "shopify.app.toml"

jobs:
  deploy:
    name: Deploy Extensions to Shopify
    runs-on: ubuntu-latest
    env:
      # Required for Shopify CLI to run headlessly in CI/CD
      SHOPIFY_API_KEY: ${{ secrets.SHOPIFY_API_KEY }}
      SHOPIFY_CLI_PARTNER_TOKEN: ${{ secrets.SHOPIFY_CLI_PARTNER_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22.18
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Deploy Extensions
        # --allow-updates flag allows the CLI to update the extension if it has already been deployed before, which is common in CI/CD pipelines
        run: npm run deploy -- --allow-updates
