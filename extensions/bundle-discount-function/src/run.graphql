query RunInput($collectionIds: [ID!] = []) {
  cart {
    lines {
      id
      quantity
      bundleCollectionIds: attribute(key: "_bundle_collection_ids") {
        value
      }
      merchandise {
        __typename
        ... on ProductVariant {
          id
          sku
          product {
            id
            bundleCollectionMemberships: inCollections(ids: $collectionIds) {
              collectionId
              isMember
            }
          }
        }
      }
    }
  }
  discount {
    metafield(namespace: "$app:bundler", key: "bundle_rules") {
      jsonValue
    }
  }
}
