api_version = "2026-07"

[[extensions]]
name = "Mix-and-match bundle discount"
handle = "bundle-discount-function"
type = "function"
uid = "bundle-discount-function"

[[extensions.targeting]]
target = "cart.lines.discounts.generate.run"
input_query = "src/run.graphql"
export = "cart-lines-discounts-generate-run"

[extensions.build]
command = ""
path = "dist/function.wasm"

[extensions.ui.paths]
create = "/app/bundles/new"
details = "/app/bundles"
